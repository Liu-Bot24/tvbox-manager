<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视仓接口中心 - 控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .dashboard-container { max-width: 1400px; width: 96%; margin: 0 auto; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .sub-box {
            background: rgba(59, 130, 246, 0.05);
            border: 1px dashed var(--accent);
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .sub-link {
            display: inline-block;
            background: rgba(0,0,0,0.3);
            padding: 12px 20px;
            border-radius: 8px;
            color: #60a5fa;
            font-family: 'JetBrains Mono', monospace;
            margin: 15px 0;
            word-break: break-all;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .main-layout { display: flex; flex-direction: column; gap: 2rem; }
        .add-panel { max-width: 500px; margin: 0 auto; width: 100%; }
        
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .source-card { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2 style="font-weight: 800; letter-spacing: -1px;">🚀 影视仓接口管理</h2>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span class="version-tag">{{ version }}</span>
                <span style="color: var(--text-muted)">{{ username }}</span>
                {% if is_admin %}
                <a href="/admin" class="btn" style="width:auto; padding: 8px 15px; border: 1px solid #60a5fa; color: #60a5fa; text-decoration: none; border-radius: 8px;">🎛️ 管理控制台</a>
                {% endif %}
                <a href="{{ url_for('api_logout') }}" class="btn action-btn" style="width:auto; padding: 8px 15px">登出</a>
            </div>
        </div>

        <div class="glass-panel sub-box">
            <h3 style="margin-bottom: 0.5rem">🔗 我的专属订阅链接</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">导入的配置会合并为一份；在下方逐站点勾选后，将此地址填入 FongMi 点播配置。</p>
            <div class="sub-link" id="subLink">{{ sub_url }}</div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 5px; margin-bottom: 15px;">
                <input type="checkbox" id="onlyOnline" onchange="updateSubUrl()" style="width: 16px; height: 16px; cursor: pointer;">
                <label for="onlyOnline" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; user-select: none;">只导出已探测成功的站点（未探测站点也会被排除）</label>
            </div>
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <button class="btn btn-primary" style="width:auto" onclick="copyLink()">📋 复制链接</button>
                <button class="btn action-btn" style="width:auto" onclick="openPreview()">👁️ 预览 JSON</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="top-panels" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;">
                <div class="glass-panel add-panel" style="flex: 1; min-width: 300px; max-width: 500px; margin: 0;">
                    <h3 style="margin-bottom: 1.5rem; text-align: center;">➕ 添加新接口</h3>
                    <form id="addForm">
                        <input type="hidden" id="sourceId">
                        <div class="form-group">
                            <label>接口名称</label>
                            <input type="text" id="name" class="form-control" placeholder="例如：阿里专线 / 直播源 A" required>
                        </div>
                        <div class="form-group">
                            <label>配置或直播地址 (URL)</label>
                            <input type="url" id="url" class="form-control" placeholder="https://.../config.json" required>
                        </div>
                        <div class="form-group">
                            <label>接口类型</label>
                            <select id="type" class="form-control" style="background: #111827">
                                <option value="site">TVBox JSON 配置</option>
                                <option value="live">直播频道 (Live URL)</option>
                            </select>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary mt-4">立即保存接口</button>
                        <button type="button" id="cancelEdit" class="btn action-btn mt-2" style="display:none" onclick="resetForm()">取消编辑</button>
                    </form>
                </div>

                <div class="glass-panel recommended-panel" style="flex: 1; min-width: 300px; max-width: 500px; margin: 0; display: flex; flex-direction: column;">
                    <h3 style="margin-bottom: 1.5rem; text-align: center;">🌟 推荐接口</h3>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 12px; height: 24px;">
                        <input type="checkbox" id="selectAllRec" onclick="toggleSelectAllRec(this)" style="width: 15px; height: 15px; cursor: pointer;">
                        <label for="selectAllRec" style="font-size: 0.8rem; color: var(--text-muted); cursor: pointer; user-select: none;">全选内容</label>
                    </div>
                    <div id="recommendedList" style="flex-grow: 1; overflow-y: auto; max-height: 340px; padding-right: 10px; display: flex; flex-direction: column; gap: 10px;">
                        <p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">加载中...</p>
                    </div>
                    <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-glass); padding-top: 1.5rem; display: flex; gap: 10px; justify-content: center;">
                        <button class="btn btn-primary" style="flex: 1;" onclick="addSelectedRecommended()">批量添加选中</button>
                        <button class="btn" style="flex: 1; background: transparent; border: 1px solid #4ade80; color: #4ade80;" onclick="addOnlineOnly()">一键添加在线</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="control-bar">
                    <h3>📋 已导入配置 (<span id="sourceCount">0</span>) <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted); margin-left:10px;">拖动卡片可改变整合顺序</span></h3>
                    <button class="action-btn" onclick="loadSources()">🔄 刷新列表</button>
                </div>
                <div class="source-grid" id="sourceList"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>JSON 配置预览</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <pre id="jsonPreview">加载中...</pre>
            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <button class="btn btn-primary" style="width:auto" onclick="copyPreview()">📋 复制预览内容</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="sitesModal">
        <div class="modal-content" style="max-width: 1050px;">
            <div class="modal-header">
                <h3 id="sitesTitle">站点</h3>
                <button class="close-modal" onclick="closeSites()">×</button>
            </div>
            <p style="color:var(--text-muted); margin-bottom:1rem;">标准 CMS 源可检测搜索、详情与可直接访问的 HLS 首段。Spider/JAR 源需要电视端运行环境，这里会显示“暂不支持探测”。</p>
            <div style="display:flex;gap:0.75rem;margin-bottom:1rem;">
                <input id="probeKeyword" class="form-control" style="max-width:180px;padding:6px 10px" value="庆余年" aria-label="探测搜索词" placeholder="搜索词">
                <button class="action-btn" onclick="loadSites(true)">刷新原始配置</button>
                <button class="action-btn" id="probeAllButton" onclick="probeAllSites()">探测可支持的站点</button>
            </div>
            <div id="sitesList" class="sites-list"></div>
        </div>
    </div>

    <script>
        let activeSourceId = null;
        let activeSites = [];
        const subBaseUrl = "{{ sub_url }}";

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {}
                document.body.removeChild(textArea);
                return Promise.resolve();
            }
        }

        function copyLink() {
            copyText(document.getElementById('subLink').innerText).then(() => alert('✅ 订阅链接已复制'));
        }

        function updateSubUrl() {
            const onlyOnline = document.getElementById('onlyOnline').checked;
            const subLinkEl = document.getElementById('subLink');
            if (onlyOnline) {
                subLinkEl.innerText = subBaseUrl.includes('?') ? `${subBaseUrl}&only_online=true` : `${subBaseUrl}?only_online=true`;
            } else {
                subLinkEl.innerText = subBaseUrl;
            }
        }

        function copyPreview() {
            copyText(document.getElementById('jsonPreview').innerText).then(() => alert('✅ JSON 内容已复制'));
        }

        function openPreview() {
            document.getElementById('previewModal').style.display = 'flex';
            fetchPreview();
        }

        function closeModal() {
            document.getElementById('previewModal').style.display = 'none';
        }

        async function fetchPreview() {
            const previewEl = document.getElementById('jsonPreview');
            previewEl.innerText = '// 正在生成预览...';
            const onlyOnline = document.getElementById('onlyOnline').checked;
            let url = subBaseUrl;
            if (onlyOnline) url += `${url.includes('?') ? '&' : '?'}only_online=true`;
            
            const res = await fetch(url);
            const text = await res.text();
            previewEl.innerText = text;
        }

        async function loadSources() {
            const container = document.getElementById('sourceList');
            container.innerHTML = '<p style="color:var(--text-muted)">正在同步数据...</p>';
            
            const res = await fetch('/api/source/list');
            const json = await res.json();
            container.innerHTML = '';
            document.getElementById('sourceCount').innerText = json.data.length;
            
            if(json.data.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted)">暂无接口，快去上方添加一个吧！</div>';
                return;
            }

            json.data.forEach(item => {
                const typeClass = item.type === 'site' ? 'site' : 'live';
                const typeName = item.type === 'site' ? '点播' : '直播';
                
                const card = document.createElement('div');
                card.className = `source-card ${typeClass}`;
                card.dataset.id = item.id;
                card.style.cursor = 'grab'; // 提示可拖拽
                card.innerHTML = `
                    <div class="source-header" style="cursor: grab;" active="cursor: grabbing;">
                        <div class="source-title">${escapeHtml(item.name)}</div>
                        <span class="status-badge ${item.status === 'online' ? 'status-online' : item.status === 'offline' ? 'status-offline' : 'status-checking'}" id="status-${item.id}">${item.status === 'online' ? '配置可达' : item.status === 'offline' ? '配置失败' : '未检测'}${item.latency_ms !== null ? ` · ${item.latency_ms} ms` : ''}</span>
                    </div>
                    <div class="source-url">${escapeHtml(item.url)}</div>
                    <div class="source-footer">
                        <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;"><input type="checkbox" class="source-enable" ${item.enabled ? 'checked' : ''}> 启用整份配置</label>
                        <div class="card-actions">
                            ${item.type === 'site' ? `<button class="action-btn" onclick="openSites(${item.id}, this)" title="查看站点">站点 / 勾选</button>` : ''}
                            <button class="action-btn" onclick="checkStatus(${item.id})" title="检测配置">测配置</button>
                            <button class="action-btn" onclick='prepareEdit(this)' data-item='${btoa(encodeURIComponent(JSON.stringify(item)))}' title="编辑">✏️</button>
                            <button class="action-btn copy-source" title="复制链接">📋</button>
                            <button class="action-btn delete" onclick="deleteSource(${item.id})" title="删除">🗑️</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
                card.querySelector('.copy-source').addEventListener('click', () =>
                    copyText(item.url).then(() => alert('链接已复制')));
                card.querySelector('.source-enable').addEventListener('change', async (event) => {
                    const box = event.target;
                    box.disabled = true;
                    try {
                        const response = await fetch('/api/source/enable', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({id: item.id, enabled: box.checked})
                        });
                        const result = await response.json();
                        if (result.status !== 'success') throw new Error(result.message);
                    } catch (error) { box.checked = !box.checked; alert(error.message); }
                    finally { box.disabled = false; }
                });
            });
            
            // 初始化或刷新拖拽排序
            initSortable();

        }

        let sortableInstance = null;
        function initSortable() {
            const container = document.getElementById('sourceList');
            if (sortableInstance) {
                sortableInstance.destroy();
            }
            sortableInstance = new Sortable(container, {
                animation: 150,
                filter: 'input, button',
                delay: 100, // 给移动端稍加一点延迟防误触
                delayOnTouchOnly: true,
                onEnd: async function () {
                    const cards = container.querySelectorAll('.source-card');
                    const newOrder = Array.from(cards).map(card => parseInt(card.dataset.id));
                    
                    try {
                        await fetch('/api/source/reorder', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ order: newOrder })
                        });
                        // 重绘实时预览JSON以匹配新序列
                        fetchPreview();
                    } catch(e) {
                        console.error('排序保存失败', e);
                    }
                }
            });
        }

        async function checkStatus(id) {
            const el = document.getElementById(`status-${id}`);
            try {
                const res = await fetch('/api/source/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id})
                });
                const data = await res.json();
                if(data.status === 'success' && data.status_val === 'online') {
                    el.innerText = `配置可达 · ${data.latency_ms} ms`;
                    el.className = 'status-badge status-online';
                } else {
                    el.innerText = '离线';
                    el.className = 'status-badge status-offline';
                }
            } catch (e) {
                el.innerText = '超时';
                el.className = 'status-badge status-offline';
            }
        }

        async function openSites(id, button) {
            activeSourceId = id;
            document.getElementById('sitesTitle').textContent = `${button.closest('.source-card').querySelector('.source-title').textContent} · 站点选择`;
            document.getElementById('sitesModal').style.display = 'flex';
            await loadSites(false);
        }

        function closeSites() {
            document.getElementById('sitesModal').style.display = 'none';
            activeSourceId = null;
        }

        async function loadSites(refresh) {
            const sourceId = activeSourceId;
            const list = document.getElementById('sitesList');
            list.textContent = refresh ? '正在刷新原始配置...' : '正在读取站点...';
            try {
                const response = await fetch(`/api/source/${sourceId}/sites${refresh ? '?refresh=true' : ''}`);
                const payload = await response.json();
                if (sourceId !== activeSourceId) return;
                if (payload.status !== 'success') throw new Error(payload.message);
                activeSites = payload.data;
                list.replaceChildren();
                for (const site of activeSites) {
                    const row = document.createElement('div');
                    row.className = 'site-row';
                    const box = document.createElement('input');
                    box.type = 'checkbox';
                    box.checked = site.enabled;
                    box.setAttribute('aria-label', `启用 ${site.name}`);
                    box.addEventListener('change', async () => {
                        box.disabled = true;
                        try {
                            const res = await fetch('/api/site/enable', {
                                method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({source_id: sourceId, key: site.key, enabled: box.checked})
                            });
                            const data = await res.json();
                            if (data.status !== 'success') throw new Error(data.message);
                            site.enabled = box.checked;
                        } catch (error) {
                            box.checked = !box.checked;
                            alert(error.message);
                        } finally { box.disabled = false; }
                    });
                    const name = document.createElement('span');
                    name.className = 'site-name';
                    name.textContent = site.name;
                    name.title = site.key;
                    const result = document.createElement('span');
                    result.className = 'site-result';
                    result.textContent = describeProbe(site.result);
                    const probe = document.createElement('button');
                    probe.className = 'action-btn';
                    probe.textContent = '探测';
                    probe.addEventListener('click', () => probeOne(sourceId, site, result, probe));
                    row.append(box, name, result, probe);
                    list.appendChild(row);
                }
            } catch (error) {
                list.textContent = `读取失败：${error.message}`;
            }
        }

        function describeProbe(result) {
            if (!result) return '未探测';
            if (result.status === 'unsupported') return '暂不支持探测';
            if (result.status !== 'online') return `失败 · ${result.stage || '请求'}${result.search_ms !== undefined ? ` · ${result.search_ms} ms` : ''}${result.error ? ` · ${result.error}` : ''}`;
            const parts = [`搜索 ${result.search_ms} ms`, `详情 ${result.detail_ms} ms`];
            if (result.playback === 'ok') parts.push(`播放首段 ${result.play_latency_ms} ms · ${result.speed_kbps} kbps`);
            else if (result.playback === 'failed') parts.push('播放失败');
            else parts.push('播放未验证');
            return parts.join(' / ');
        }

        async function probeOne(sourceId, site, resultElement, button) {
            button.disabled = true;
            resultElement.textContent = '探测中...';
            try {
                const response = await fetch('/api/site/probe', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({source_id: sourceId, key: site.key, keyword: document.getElementById('probeKeyword').value})
                });
                const payload = await response.json();
                if (payload.status !== 'success') throw new Error(payload.message);
                site.result = payload.data;
                resultElement.textContent = describeProbe(site.result);
            } catch (error) { resultElement.textContent = `探测失败：${error.message}`; }
            finally { button.disabled = false; }
        }

        async function probeAllSites() {
            const button = document.getElementById('probeAllButton');
            button.disabled = true;
            const sourceId = activeSourceId;
            const rows = [...document.querySelectorAll('#sitesList .site-row')];
            const jobs = activeSites.map((site, index) => ({site, row: rows[index]}))
                .filter(({site}) => [0, 1, 4].includes(site.type) && /^https?:\/\//.test(site.api));
            let next = 0;
            let done = 0;
            button.textContent = `探测中 0/${jobs.length}`;
            const worker = async () => {
                while (next < jobs.length && activeSourceId === sourceId) {
                    const index = next++;
                    const {site, row} = jobs[index];
                    await probeOne(sourceId, site, row.querySelector('.site-result'), row.querySelector('button'));
                    button.textContent = `探测中 ${++done}/${jobs.length}`;
                }
            };
            await Promise.all(Array.from({length: Math.min(4, jobs.length)}, worker));
            button.disabled = false;
            button.textContent = '探测可支持的站点';
        }

        function prepareEdit(btn) {
            try {
                const item = JSON.parse(decodeURIComponent(atob(btn.dataset.item)));
                editSource(item);
            } catch(e) { console.error("解析编辑数据失败", e); }
        }

        function editSource(item) {
            document.getElementById('sourceId').value = item.id;
            document.getElementById('name').value = item.name;
            document.getElementById('url').value = item.url;
            document.getElementById('type').value = item.type;
            document.getElementById('submitBtn').innerText = '保存修改';
            document.getElementById('cancelEdit').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('addForm').reset();
            document.getElementById('sourceId').value = '';
            document.getElementById('submitBtn').innerText = '立即保存接口';
            document.getElementById('cancelEdit').style.display = 'none';
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('sourceId').value;
            const endpoint = id ? '/api/source/update' : '/api/source/add';
            
            const payload = {
                name: document.getElementById('name').value,
                url: document.getElementById('url').value,
                type: document.getElementById('type').value
            };
            if(id) payload.id = id;

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if(data.status === 'success') {
                resetForm();
                loadSources();
            } else {
                alert(data.message);
            }
        });

        async function deleteSource(id) {
            if(!confirm('确定要移除此接口吗？')) return;
            const res = await fetch('/api/source/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id})
            });
            const data = await res.json();
            if(data.status === 'success') loadSources();
        }

        async function loadRecommended() {
            try {
                const res = await fetch('/api/external/aipan');
                const json = await res.json();
                const container = document.getElementById('recommendedList');
                if (json.status === 'success' && json.data) {
                    container.innerHTML = '';
                    document.getElementById('selectAllRec').checked = false; // 重置全选状态
                    json.data.forEach((item, index) => {
                        const recId = 'rec_' + index;
                        const row = document.createElement('div');
                        row.className = 'recommended-item';
                        row.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid var(--border-glass);">
                                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                                    <input type="checkbox" class="rec-checkbox" data-name="${item.name}" data-url="${item.link}" style="width: 16px; height: 16px; flex-shrink: 0;">
                                    <div style="min-width: 0;">
                                        <div style="font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.name}">${item.name}</div>
                                        <div style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.link}">${item.link}</div>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                                    <span class="status-badge status-checking" id="rec-status-${index}" style="font-size: 0.7rem;">查</span>
                                </div>
                            </div>
                        `;
                        container.appendChild(row);
                        
                        // Check status for this recommended item
                        fetch('/api/source/check', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({url: item.link})
                        }).then(r => r.json()).then(data => {
                            const badge = document.getElementById(`rec-status-${index}`);
                            if(data.status === 'success' && data.status_val === 'online') {
                                badge.className = 'status-badge status-online';
                                badge.innerText = '在线';
                            } else {
                                badge.className = 'status-badge status-offline';
                                badge.innerText = '异常';
                            }
                        }).catch(() => {
                            const badge = document.getElementById(`rec-status-${index}`);
                            badge.className = 'status-badge status-offline';
                            badge.innerText = '异常';
                        });
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">加载失败或无推荐接口</p>';
                }
            } catch (e) {
                document.getElementById('recommendedList').innerHTML = '<p style="text-align: center; color: #ef4444; margin-top: 2rem;">网络错误，获取失败</p>';
            }
        }

        async function addSelectedRecommended() {
            const checkboxes = document.querySelectorAll('.rec-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请先勾选需要添加的接口！');
                return;
            }
            let successCount = 0;
            let errorCount = 0;
            const promises = Array.from(checkboxes).map(async (cb) => {
                const name = cb.getAttribute('data-name');
                const url = cb.getAttribute('data-url');
                try {
                    const res = await fetch('/api/source/add', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name, url, type: 'site'})
                    });
                    const data = await res.json();
                    if(data.status === 'success') successCount++;
                    else errorCount++;
                } catch { errorCount++; }
            });

            await Promise.all(promises);
            alert(`批量添加完成！成功: ${successCount}，跳过/失败: ${errorCount}`);
            loadSources();
            // Uncheck all after success
            if(successCount > 0) {
                checkboxes.forEach(cb => cb.checked = false);
                document.getElementById('selectAllRec').checked = false;
            }
        }

        function toggleSelectAllRec(master) {
            const checkboxes = document.querySelectorAll('.rec-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        async function addOnlineOnly() {
            // 找到所有状态为“在线”的推荐项中的 checkbox
            const onlineCheckboxes = [];
            const items = document.querySelectorAll('.recommended-item');
            items.forEach(item => {
                const badge = item.querySelector('.status-badge');
                if (badge && badge.classList.contains('status-online')) {
                    const cb = item.querySelector('.rec-checkbox');
                    if (cb) onlineCheckboxes.push(cb);
                }
            });

            if (onlineCheckboxes.length === 0) {
                alert('暂时没有检测到在线的接口，请稍候或手动勾选！');
                return;
            }

            if (!confirm(`检测到 ${onlineCheckboxes.length} 个在线接口，是否一键添加？`)) return;

            let successCount = 0;
            let errorCount = 0;
            const promises = onlineCheckboxes.map(async (cb) => {
                const name = cb.getAttribute('data-name');
                const url = cb.getAttribute('data-url');
                try {
                    const res = await fetch('/api/source/add', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name, url, type: 'site'})
                    });
                    const data = await res.json();
                    if(data.status === 'success') successCount++;
                    else errorCount++;
                } catch { errorCount++; }
            });

            await Promise.all(promises);
            alert(`一键添加在线接口完成！成功: ${successCount}，跳过/重复: ${errorCount}`);
            loadSources();
        }

        loadSources();
        loadRecommended();
    </script>
</body>
</html>
