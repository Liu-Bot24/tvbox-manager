services:
  tvbox-manager:
    build: .
    image: tvbox-manager-local:site-probes
    container_name: tvbox-manager
    ports:
      - "192.168.6.237:8089:8089"
    environment:
      REG_CODE: ${REG_CODE:-888888}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      BASE_URL: ${BASE_URL:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: unless-stopped
